stages:
  - test

test:
  image: python:3.12
  stage: test
  services:
    - postgres:15
  variables:
    POSTGRES_DB: backup_service_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_HOST: postgres
    DJANGO_SETTINGS_MODULE: backup_service.settings_ci
    PYTHONUNBUFFERED: 1
  before_script:
    - pip install -r requirements.txt
    - pip install psycopg2-binary
    - python manage.py migrate --noinput
  script:
    - python manage.py check
    - python -c "import django; django.setup(); from django.test.utils import get_runner; from django.conf import settings; TestRunner = get_runner(settings); test_runner = TestRunner(settings); failures = test_runner.run_tests(['backups', 'users', 'core']); exit(failures)"
