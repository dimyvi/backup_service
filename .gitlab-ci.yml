stages:
  - test
  - build

test:
  image: python:3.12
  stage: test
  script:
    - pip install -r requirements.txt
    - python manage.py check
    - echo "Pipeline работает!"

build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t backup_service:latest .
