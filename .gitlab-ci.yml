stages:
  - test
  - build

variables:
  DJANGO_SETTINGS_MODULE: "backup_service.settings"
  PYTHONUNBUFFERED: "1"

test:
  image: python:3.12
  stage: test
  before_script:
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py test backups users core --keepdb 2>&1 || python manage.py test

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t backup_service:latest .
  only:
    - main
    - master