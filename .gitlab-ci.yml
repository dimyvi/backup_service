stages:
  - test
  - build

services:
  - postgres:16

variables:
  POSTGRES_DB: backupdb
  POSTGRES_USER: backupuser
  POSTGRES_PASSWORD: backuppass

  DB_HOST: postgres
  DB_NAME: backupdb
  DB_USER: backupuser
  DB_PASSWORD: backuppass
  DB_PORT: "5432"

  SECRET_KEY: "ci-only-secret-key-12345"

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py migrate
    - pytest


build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]

  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375

  privileged: true

  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY

  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest