stages:
  - test
  - build

test:
  image: python:3.12
  stage: test
  before_script:
    - pip --version
    - python --version
  script:
    - pip install -r requirements.txt
    - pytest

build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - docker --version
    - docker info
  script:
    - docker build -t backup_service .