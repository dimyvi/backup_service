stages:
  - test
  - build

variables:
  POSTGRES_DB: backupdb
  POSTGRES_USER: backupuser
  POSTGRES_PASSWORD: backuppass

  DB_HOST: postgres
  DB_NAME: backupdb
  DB_USER: backupuser
  DB_PASSWORD: backuppass
  DB_PORT: "5432"

  SECRET_KEY: "ci-only-secret-key-12345"

services:
  - name: postgres:16
    alias: postgres

test:
  stage: test
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py migrate
    - pytest


build:
  stage: build
  image: docker:24

  services:
    - docker:dind

  variables:
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker build -t backup-service:latest .