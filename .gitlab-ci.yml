stages:
  - test
  - build

test:
  image: python:3.12
  stage: test
  services:
    - postgres:15
  variables:
    POSTGRES_DB: backup_service_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DJANGO_SETTINGS_MODULE: backup_service.settings_ci
    PYTHONUNBUFFERED: 1
  before_script:
    - pip install -r requirements.txt
    - pip install psycopg2-binary
    - python manage.py migrate --noinput
  script:
    - python manage.py check
    - python manage.py test backups --verbosity=2

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t backup_service:latest .
  only:
    - main
