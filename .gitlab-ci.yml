stages:
  - test
  - build

variables:
  POSTGRES_DB: backupdb
  POSTGRES_USER: backupuser
  POSTGRES_PASSWORD: password
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

  DB_NAME: backupdb
  DB_USER: backupuser
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

  SECRET_KEY: testsecret
  DEBUG: "True"
  ALLOWED_HOSTS: "*"

test:
  stage: test

  image: python:3.12

  services:
    - name: postgres:16
      alias: postgres

  before_script:
    - apt-get update && apt-get install -y netcat-openbsd
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

    - echo "Waiting for PostgreSQL..."
    - |
      while ! nc -z postgres 5432; do
        sleep 1
      done

  script:
    - python manage.py migrate
    - python manage.py test backups core users

build:
  stage: build

  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info

  script:
    - docker build -t backup-service .