stages:
  - test
  - build

test:
  image: python:3.12
  stage: test
  script:
    - echo "=== Проверка установки зависимостей ==="
    - python --version
    - pip list
    - echo "=== Все зависимости установлены успешно ==="
    - echo "=== Django тесты пропущены для первой настройки ==="

build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  script:
    - echo "=== Сборка Docker образа ==="
    - docker build -t backup_service .
    - echo "=== Образ успешно собран ==="