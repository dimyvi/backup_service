stages:
  - test
  - build

test:
  image: python:3.12
  stage: test
  variables:
    DJANGO_SETTINGS_MODULE: "backup_service.settings"
    PYTHONUNBUFFERED: "1"
  before_script:
    - pip install -r requirements.txt
    - python manage.py migrate
  script:
    - python manage.py check
    - python manage.py test backups --verbosity=2
  after_script:
    - echo "Тесты пройдены"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t backup_service:latest .
    - echo "Docker образ собран"
  only:
    - main