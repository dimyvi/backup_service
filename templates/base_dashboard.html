<!-- base_dashboard.html -->

<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <link
        rel="icon"
        href="/static/favicon.ico"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Backup Service
        {% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #efefef;
            color: #111;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        input,
        button {
            outline: none;
            border: 1px solid #000;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           TOPBAR
        ========================== */

        .topbar {
            height: 52px;
            background: #000;

            display: flex;
            align-items: center;

            padding: 0 20px;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-left: auto;

            color: #fff;
            font-size: 14px;
        }

        .user-badge {
            padding: 7px 12px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #111;
        }

        .logout-link {
            padding: 7px 12px;

            border: 1px solid #666;
            border-radius: 8px;

            transition: .15s;
        }

        .logout-link:hover {
            background: #222;
        }

        /* =========================
           PAGE
        ========================== */

        .page {
            padding: 12px;
            height: calc(100vh - 52px);
        }

        .dashboard {
            display: flex;
            gap: 16px;
            height: 100%;
        }

        /* =========================
           LEFT
        ========================== */

        .sidebar {
            width: 760px;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        /* =========================
           UPLOAD
        ========================== */

        .upload-box {
            border: 1px solid #000;
            background: #f8f8f8;

            padding: 10px;
        }

        .upload-form {
            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            gap: 20px;
        }

        .upload-left {
            display: flex;
            align-items: center;
            gap: 8px;

            min-width: 0;
        }

        .upload-right {
            display: flex;
            align-items: center;
            gap: 8px;

            flex-shrink: 0;
        }

        .upload-form input[type="text"] {
            width: 220px;
            padding: 8px;
        }

        /* =========================
           FILE
        ========================== */

        .file-upload {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 8px 14px;

            background: #000;
            color: #fff;

            border-radius: 6px;

            cursor: pointer;

            flex-shrink: 0;
        }

        .file-upload input {
            position: absolute;
            inset: 0;

            opacity: 0;
            cursor: pointer;
        }

        .file-name {
            width: 170px;

            font-size: 14px;
            color: #444;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* =========================
           REMOVE FILE
        ========================== */

        .remove-file {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff;

            border-radius: 6px;

            font-size: 18px;
            line-height: 1;

            transition: .15s;
        }

        .remove-file:hover {
            background: #000;
            color: #fff;
        }

        .hidden {
            display: none;
        }

        /* =========================
           BACKUPS
        ========================== */

        .backup-list {
            border: 1px solid #000;
            background: #fff;

            display: flex;
            flex-direction: column;

            flex: 1;
            min-height: 0;
        }

        .backup-header,
        .backup-row {
            display: grid;

            grid-template-columns:
                1fr
                120px
                170px
                180px;

            gap: 12px;
            padding: 12px;
        }

        .backup-header {
            border-bottom: 1px solid #000;
            background: #f2f2f2;

            font-weight: bold;
        }

        .backup-scroll {
            overflow-y: auto;
            flex: 1;
        }

        .backup-row {
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .backup-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .empty {
            padding: 20px;
            color: #666;
        }

        /* =========================
           RIGHT
        ========================== */

        .content-panel {
            flex: 1;

            border: 1px solid #000;
            background: #fff;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           STATS
        ========================== */

        .stats-panel {
            padding: 24px;
        }

        .stats-title {
            font-size: 15px;
            font-weight: bold;

            margin-bottom: 24px;

            text-transform: lowercase;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .stat-item {
            padding-bottom: 14px;
            border-bottom: 1px solid #ddd;
        }

        .stat-label {
            font-size: 13px;
            color: #666;

            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        /* =========================
           ACTIVITY
        ========================== */

        .activity-panel {
            border-top: 1px solid #ddd;

            padding: 24px;

            flex: 1;
            min-height: 0;

            overflow-y: auto;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

            gap: 12px;
        }

        .activity-main {
            display: flex;
            gap: 8px;

            min-width: 0;
        }

        .activity-action {
            font-weight: bold;
            text-transform: lowercase;
        }

        .activity-file {
            color: #444;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .activity-date {
            color: #777;
            font-size: 13px;

            flex-shrink: 0;
        }

        /* =========================
           BUTTONS
        ========================== */

        .btn {
            background: #000;
            color: #fff;

            border-radius: 6px;

            padding: 8px 12px;

            font-size: 14px;

            transition: .15s;
        }

        .btn:hover {
            opacity: .9;
        }

        .danger-btn:hover {
            background: #c40000;
            border-color: #c40000;
        }

    </style>

</head>

<body>

<header class="topbar">

    {% if request.user.is_authenticated %}

        <div class="topbar-user">

            <div class="user-badge">
                user: {{ request.user.username }}
            </div>

            <a
                href="{% url 'logout' %}"
                class="logout-link"
            >
                logout
            </a>

        </div>

    {% endif %}

</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

</body>
</html>
