services:
  db:
    image: postgres:16
    container_name: backup_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  web:
    build: .
    container_name: backup_web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: backup_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - backend

volumes:
  pgdata:
  static_volume:

networks:
  backend: